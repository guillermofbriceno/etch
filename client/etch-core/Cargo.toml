[package]
name = "etch-core"
version = "0.0.0"
edition = "2024"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
serde = "1.0"
tauri = "2.10"
log = { version = "0.4", features = ["std"] }
matrix-sdk = { version = "0.16.0", features = ["bundled-sqlite", "e2e-encryption"] }
matrix-sdk-ui = "0.16.0"
anyhow = "1.0"
serde_json = "1.0"
futures-util = "0.3"
mime_guess = "2"
futures = "0.3"
bridge-types = { path = "../../shared/bridge-types" }
interprocess = { version = "2", features = ["tokio"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.10"
sha1 = "0.10"
snafu = "0.9"
native-tls = "0.2"
tokio-native-tls = "0.3"
rusqlite = "0.37"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
win32job = "2"
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[features]
integration-tests = []
conduwuit-reaction-echo-fixed = []

[dev-dependencies]
# `test-util` is the only addition here: it is what lets a test drive the sync
# loop's 122-second retry ceiling on a paused clock instead of waiting it out.
# Dev-only, so nothing about the shipped build changes.
tokio = { version = "1.50", features = ["full", "test-util"] }
tempfile = "3"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
