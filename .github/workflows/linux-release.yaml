name: "Linux Build"

# Run on its own for a test build (artifacts only), or called by release.yaml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for this test build, without the v (e.g. 0.3.1-test.1). Leave blank for an automatic dev version.'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  MUMBLE_RELEASE_URL: https://github.com/guillermofbriceno/mumble/releases/download/etch-mumble-patch/mumble-linux-x86_64.tar.gz
  MUMBLE_ARTIFACT: mumble-linux-x86_64.tar.gz
  MUMBLE_SHA256: 1744d5a48a8d38160d5392dd11a00861526026244aaf3b09bad97cf1c89619e5

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set app version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            bash .github/scripts/version.sh check "$INPUT_VERSION"
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(bash .github/scripts/version.sh dev "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")
          fi
          CONF=client/etch-gui/src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' "$CONF" > "$CONF.tmp" && mv "$CONF.tmp" "$CONF"
          echo "Building Etch $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            libasound2-dev \
            libopus-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            protobuf-compiler \
            xdg-utils \
            desktop-file-utils

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: client/etch-gui

      # ---- Mumble + Bridge bundling ----

      - name: Download Mumble
        if: ${{ !env.ACT }}
        run: curl -L -o "$MUMBLE_ARTIFACT" "$MUMBLE_RELEASE_URL"

      - name: Verify Mumble checksum
        if: ${{ !env.ACT }}
        run: |
          ACTUAL=$(sha256sum "$MUMBLE_ARTIFACT" | awk '{print $1}')
          echo "Expected: $MUMBLE_SHA256"
          echo "Actual:   $ACTUAL"
          if [ "$MUMBLE_SHA256" != "$ACTUAL" ]; then
            echo "::error::Checksum mismatch for $MUMBLE_ARTIFACT"
            exit 1
          fi

      - name: Extract Mumble into bundled/
        if: ${{ !env.ACT }}
        run: |
          mkdir -p client/etch-gui/src-tauri/bundled/mumble
          tar xzf "$MUMBLE_ARTIFACT" -C client/etch-gui/src-tauri/bundled/mumble/

      - name: Build bridge plugin
        run: cargo build --release -p etch-bridge

      - name: Copy bridge plugin into bundled/
        run: cp target/release/libetch_bridge.so client/etch-gui/src-tauri/bundled/

      - name: Verify bundled contents
        run: |
          echo "=== Bundled contents ==="
          find client/etch-gui/src-tauri/bundled/ -type f | head -50
          echo "=== Mumble binary ==="
          file client/etch-gui/src-tauri/bundled/mumble/bin/mumble || echo "WARNING: mumble binary not found"
          echo "=== Bridge plugin ==="
          file client/etch-gui/src-tauri/bundled/libetch_bridge.so

      # ---- Build deb/rpm ----

      - name: Build deb/rpm (GitHub CI)
        if: ${{ !env.ACT }}
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client/etch-gui
          args: --bundles deb,rpm

      - name: Build deb/rpm (local/act)
        if: ${{ env.ACT == 'true' }}
        run: |
          cargo install tauri-cli --locked
          cd client/etch-gui && cargo tauri build --bundles deb,rpm

      # ---- Build AppImage ----
      # linuxdeploy scans ALL ELF files in the AppDir and resolves their deps.
      # The bundled Mumble .so files are already self-contained (processed by
      # linuxdeploy in the Mumble fork CI), so we stash them out of the AppDir,
      # run linuxdeploy on just the Etch binary, then restore and re-package.

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1

          # Clean stale state from previous builds (--reuse containers)
          rm -rf target/release/bundle/appimage /tmp/etch-bundled-appdir

          # Let Tauri create the AppDir (linuxdeploy fails on Mumble's Qt6 deps — expected)
          cd client/etch-gui && cargo tauri build --bundles appimage 2>&1 || true
          cd ../..

          APPDIR=$(find target/release/bundle/appimage -name '*.AppDir' -type d | head -1)
          if [ -z "$APPDIR" ]; then echo "ERROR: AppDir not found" && exit 1; fi

          # Stash Mumble out of AppDir so linuxdeploy only scans Etch
          mv "$APPDIR/usr/lib/etch-gui/bundled" /tmp/etch-bundled-appdir

          # Run linuxdeploy on the clean AppDir
          LINUXDEPLOY=$(find /home/runner/.cache/tauri -name 'linuxdeploy-x86_64.AppImage' | head -1)
          "$LINUXDEPLOY" --appdir "$APPDIR" --plugin gtk

          # Restore Mumble into AppDir
          mv /tmp/etch-bundled-appdir "$APPDIR/usr/lib/etch-gui/bundled"

          # Package final AppImage with appimagetool
          APPIMAGETOOL=$(find /tmp -name 'appimagetool' -type f 2>/dev/null | head -1)
          if [ -z "$APPIMAGETOOL" ]; then echo "ERROR: appimagetool not found" && exit 1; fi
          ARCH=x86_64 "$APPIMAGETOOL" "$APPDIR"
          mv etch-gui-x86_64.AppImage target/release/bundle/appimage/

      - name: Sign AppImage
        if: ${{ !env.ACT }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri signer sign target/release/bundle/appimage/etch-gui-x86_64.AppImage

      # The .sig files are consumed by release.yaml when it writes latest.json.
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: etch-linux-appimage
          path: |
            target/release/bundle/appimage/etch-gui-x86_64.AppImage
            target/release/bundle/appimage/etch-gui-x86_64.AppImage.sig

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: etch-linux-rpm
          path: target/release/bundle/rpm/*.rpm*

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: etch-linux-deb
          path: target/release/bundle/deb/*.deb*

      - name: Preserve artifacts (local/act)
        if: ${{ env.ACT == 'true' }}
        run: |
          cp target/release/bundle/appimage/etch-gui-x86_64.AppImage /tmp/etch-output.AppImage
          cp target/release/bundle/rpm/*.rpm /tmp/etch-output.rpm
