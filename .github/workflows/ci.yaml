name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend tests & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/etch-gui

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/etch-gui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm check

  rust-unit:
    name: Rust unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libasound2-dev \
            libopus-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test -p etch-core
        env:
          RUST_BACKTRACE: 1

  rust-coverage:
    name: Rust coverage gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libasound2-dev \
            libopus-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            protobuf-compiler

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Single instrumented test run; the HTML report, summary, and the gate are
      # all derived from the stored profile data without recompiling or re-running.
      - name: Collect coverage
        run: cargo llvm-cov --no-report -p etch-core
        env:
          RUST_BACKTRACE: 1

      - name: Generate report and summary
        if: always()
        run: |
          cargo llvm-cov report --html
          {
            echo '## Rust coverage — etch-core'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/llvm-cov/html/
          if-no-files-found: error

      # Ratchet floor: overall etch-core line coverage may not drop below the
      # recorded baseline. Raise this number as coverage improves; never lower it.
      # History: 55.62% (2026-06-15, introduced) -> 61.34% (bridge.rs tests)
      #          -> 63.38% (timeline.rs) -> 64.81% (logger.rs)
      #          -> 67.28% (process.rs URL/config/command extraction).
      - name: Enforce coverage floor
        run: cargo llvm-cov report --fail-under-lines 67

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**'
              - '!client/etch-gui/**'
              - '!**/*.md'
              - '!.github/**'

  rust-integration:
    name: Rust integration tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libasound2-dev \
            libopus-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            protobuf-compiler \
            python3-requests

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'

      - uses: Swatinem/rust-cache@v2

      - name: Run integration tests
        run: bash tests/integration/run.sh
        env:
          RUST_BACKTRACE: 1
