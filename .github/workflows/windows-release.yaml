name: "Windows Build"

# Run on its own for a test build (artifacts only), or called by release.yaml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for this test build, without the v (e.g. 0.3.1-test.1). Leave blank for an automatic dev version.'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  MUMBLE_RELEASE_URL: https://github.com/guillermofbriceno/mumble/releases/download/etch-mumble-patch/mumble-windows-x86_64-portable.zip
  MUMBLE_ARTIFACT: mumble-windows-x86_64-portable.zip
  MUMBLE_SHA256: cd1ac0350e6dbeabc5dee84a0ef95ea89fbd24204d5e5dd11e1ed3d404e23e28

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set app version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            bash .github/scripts/version.sh check "$INPUT_VERSION"
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(bash .github/scripts/version.sh dev "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")
          fi
          MSI_VERSION=$(bash .github/scripts/version.sh msi "$VERSION" "$GITHUB_RUN_NUMBER")
          CONF=client/etch-gui/src-tauri/tauri.conf.json
          jq --arg v "$VERSION" --arg msi "$MSI_VERSION" \
            '.version = $v | .bundle.windows.wix.version = $msi' "$CONF" > "$CONF.tmp" && mv "$CONF.tmp" "$CONF"
          echo "Building Etch $VERSION (MSI version $MSI_VERSION)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: client/etch-gui

      # ---- Mumble + Bridge bundling ----

      - name: Download Mumble
        shell: bash
        run: curl -L -o "$MUMBLE_ARTIFACT" "$MUMBLE_RELEASE_URL"

      - name: Verify Mumble checksum
        shell: bash
        run: |
          ACTUAL=$(sha256sum "$MUMBLE_ARTIFACT" | awk '{print $1}')
          echo "Expected: $MUMBLE_SHA256"
          echo "Actual:   $ACTUAL"
          if [ "$MUMBLE_SHA256" != "$ACTUAL" ]; then
            echo "::error::Checksum mismatch for $MUMBLE_ARTIFACT"
            exit 1
          fi

      - name: Extract Mumble into bundled/
        shell: bash
        run: |
          mkdir -p client/etch-gui/src-tauri/bundled/mumble
          7z x "$MUMBLE_ARTIFACT" -oclient/etch-gui/src-tauri/bundled/mumble/

      - name: Build bridge plugin
        run: cargo build --release -p etch-bridge

      - name: Copy bridge plugin into bundled/
        shell: bash
        run: cp target/release/etch_bridge.dll client/etch-gui/src-tauri/bundled/

      - name: Verify bundled contents
        shell: bash
        run: |
          echo "=== Bundled contents ==="
          find client/etch-gui/src-tauri/bundled/ -type f | head -50
          echo "=== Mumble binary ==="
          file client/etch-gui/src-tauri/bundled/mumble/mumble.exe || echo "WARNING: mumble binary not found"
          echo "=== Bridge plugin ==="
          file client/etch-gui/src-tauri/bundled/etch_bridge.dll

      # ---- Build MSI ----

      - name: Build MSI
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client/etch-gui
          args: --bundles msi

      - name: Show artifact paths
        shell: bash
        run: echo '${{ steps.tauri-build.outputs.artifactPaths }}'

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: etch-windows-msi
          path: target/release/bundle/msi/*.msi*
